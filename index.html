<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>حيطة البيكسل المصرية</title>
<meta name="description" content="حيطة رقمية للمشاريع المصرية. احجز مساحتك وادعم الخير وشنط رمضان.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23071820'/%3E%3Crect x='6' y='6' width='9' height='9' fill='%2300a89d'/%3E%3Crect x='17' y='6' width='9' height='9' fill='%23e3a008'/%3E%3Crect x='6' y='17' width='9' height='9' fill='%23e3a008'/%3E%3Crect x='17' y='17' width='9' height='9' fill='%2300a89d'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800;900&family=Syne:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#071820; --ink2:#123040; --mute:#5d7380; --line:#d7e2e8;
  --sand:#f3f6f8; --white:#fff; --teal:#00a89d; --teal2:#008f86;
  --saffron:#e3a008; --saffron2:#f0c24a; --taken:#9ab0bb; --bad:#c0392b;
  --shadow:0 20px 60px rgba(7,24,32,.12);
  --display:"Cairo",system-ui,sans-serif;
  --latin:"Syne","Cairo",sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:var(--display);color:var(--ink);background:var(--sand);line-height:1.7;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input{font:inherit}
button{cursor:pointer;border:0}
img{max-width:100%}

/* NAV */
.nav{
  position:fixed; inset-inline:0; top:0; z-index:100;
  display:flex; align-items:center; justify-content:space-between; gap:12px;
  padding:14px clamp(14px,3vw,32px);
  background:rgba(243,246,248,.78); backdrop-filter:blur(14px);
  border-bottom:1px solid transparent; transition:border-color .25s, background .25s;
}
.nav.scrolled{border-bottom-color:var(--line); background:rgba(255,255,255,.9)}
.nav-brand{font-weight:900; font-size:1.05rem; letter-spacing:-.02em}
.nav-brand em{font-style:normal; color:var(--teal)}
.nav-links{display:flex; gap:18px; align-items:center; flex-wrap:wrap}
.nav-links a{font-size:.92rem; font-weight:600; color:var(--mute); transition:color .2s}
.nav-links a:hover{color:var(--ink)}
.nav-cta{
  background:var(--ink); color:#fff; padding:10px 16px; border-radius:12px; font-weight:700;
  transition:transform .2s, background .2s;
}
.nav-cta:hover{transform:translateY(-2px); background:var(--teal)}
.lang-btn{
  display:inline-flex; align-items:center; gap:8px;
  background:#fff; border:1px solid var(--line); color:var(--ink);
  padding:8px 12px; border-radius:12px; font-weight:700; position:relative;
}
.lang-btn svg{width:18px;height:18px}
.lang-menu{
  position:absolute; top:calc(100% + 8px); inset-inline-end:0;
  width:260px; max-height:50vh; overflow:auto; padding:8px;
  background:#fff; border:1px solid var(--line); border-radius:14px; box-shadow:var(--shadow);
  display:none; grid-template-columns:1fr 1fr; gap:4px; z-index:120;
}
.lang-menu.open{display:grid}
.lang-menu button{
  text-align:start; padding:10px; border-radius:10px; background:transparent; font-weight:600; font-size:.88rem;
}
.lang-menu button:hover,.lang-menu button.active{background:rgba(0,168,157,.12)}
.lang-wrap{position:relative}

/* HERO */
.hero{
  min-height:100svh; display:grid; place-items:end stretch;
  padding:120px clamp(16px,4vw,40px) 56px;
  position:relative; color:#fff; overflow:hidden;
  background:#071820;
}
.hero-photo{
  position:absolute; inset:0; width:100%; height:100%; object-fit:cover;
  transform:scale(1.08); animation:kenburns 22s ease-in-out infinite alternate;
  opacity:.55; pointer-events:none;
}
.hero-shade{
  position:absolute; inset:0;
  background:
    linear-gradient(160deg,rgba(7,24,32,.82) 10%, rgba(7,24,32,.55) 45%, rgba(7,24,32,.88) 100%),
    radial-gradient(900px 500px at 20% 20%, rgba(0,168,157,.28), transparent 55%);
  pointer-events:none;
}
.hero-canvas{position:absolute; inset:0; width:100%; height:100%; opacity:.4; pointer-events:none; z-index:1}
.hero-inner{position:relative; z-index:2; max-width:1100px; margin:0 auto; width:100%}
.brand{
  margin:0; font-size:clamp(2.8rem,10vw,6rem); font-weight:900; line-height:1.05;
  letter-spacing:-.03em; max-width:12ch;
}
.brand em{font-style:normal; color:var(--saffron2)}
.hero-lead{margin:18px 0 0; max-width:34ch; font-size:clamp(1.05rem,2.4vw,1.3rem); color:rgba(255,255,255,.82)}
.hero-actions{display:flex; flex-wrap:wrap; gap:12px; margin-top:28px}
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  padding:14px 22px; border-radius:14px; font-weight:800; transition:transform .2s, box-shadow .2s, background .2s;
}
.btn:hover{transform:translateY(-3px)}
.btn-primary{background:linear-gradient(135deg,var(--teal),var(--teal2)); color:#fff; box-shadow:0 14px 40px rgba(0,168,157,.35); animation:pulse 2.2s ease-in-out infinite}
.btn-ghost{background:rgba(255,255,255,.08); color:#fff; border:1px solid rgba(255,255,255,.28)}
.price-tag{margin-top:18px; color:var(--saffron2); font-weight:700}
.hero-stats{
  display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px;
  margin-top:40px; max-width:640px;
}
.hero-stats div{
  padding:14px 0 0; border-top:2px solid rgba(255,255,255,.18);
  opacity:0; transform:translateY(16px); animation:up .7s ease forwards;
}
.hero-stats div:nth-child(1){animation-delay:.35s}
.hero-stats div:nth-child(2){animation-delay:.5s}
.hero-stats div:nth-child(3){animation-delay:.65s}
.hero-stats b{display:block; font-family:var(--latin); font-size:clamp(1.6rem,4vw,2.2rem); font-weight:800}
.hero-stats span{color:rgba(255,255,255,.7); font-size:.9rem}
@media(max-width:640px){.hero-stats{grid-template-columns:1fr; max-width:280px}.nav-links a:not(.nav-cta){display:none}}

/* SECTIONS */
.wrap{max-width:1100px; margin:0 auto; padding:0 clamp(16px,4vw,28px)}
section{padding:clamp(64px,10vw,110px) 0}
.eyebrow{color:var(--teal); font-weight:800; letter-spacing:.04em; text-transform:uppercase; font-size:.8rem; margin:0 0 8px}
h2{margin:0; font-size:clamp(1.8rem,4vw,2.8rem); font-weight:900; line-height:1.15; letter-spacing:-.02em}
.lead{color:var(--mute); max-width:46ch; margin:12px 0 0; font-size:1.05rem}
.reveal{opacity:0; transform:translateY(36px); transition:opacity .8s ease, transform .8s cubic-bezier(.2,.8,.2,1)}
.reveal.in{opacity:1; transform:none}

/* HOW */
.how-layout{display:grid; grid-template-columns:1.05fr 1fr; gap:28px; align-items:center; margin-top:36px}
@media(max-width:900px){.how-layout{grid-template-columns:1fr}}
.how-visual{
  border-radius:28px; overflow:hidden; border:1px solid var(--line); background:#fff;
  box-shadow:var(--shadow); position:relative; aspect-ratio:4/3;
}
.how-visual img{width:100%; height:100%; object-fit:cover; display:block; transition:transform 1.2s ease}
.how-visual:hover img{transform:scale(1.05)}
.how-grid{display:grid; gap:14px}
.how-item{
  padding:22px 20px; border-radius:20px; background:#fff; border:1px solid var(--line);
  position:relative; overflow:hidden; transition:transform .25s, box-shadow .25s;
  display:grid; grid-template-columns:auto 1fr; gap:14px; align-items:start;
}
.how-item:hover{transform:translateY(-4px); box-shadow:var(--shadow)}
.how-num{
  font-family:var(--latin); font-size:2rem; font-weight:800; color:transparent;
  -webkit-text-stroke:1.5px var(--teal); line-height:1;
}
.how-item h3{margin:0 0 6px; font-size:1.15rem}
.how-item p{margin:0; color:var(--mute); font-size:.95rem}

/* WALL */
.wall-section{background:linear-gradient(180deg,#fff, var(--sand)); padding-top:clamp(48px,8vw,80px)}
.wall-head{display:flex; flex-wrap:wrap; gap:12px 24px; align-items:end; justify-content:space-between; margin-bottom:18px}
.wall-meta{color:var(--mute); font-size:.9rem; font-weight:600}
.wall-shell{
  display:grid; grid-template-columns:300px 1fr; gap:18px; align-items:stretch;
}
@media(max-width:980px){.wall-shell{grid-template-columns:1fr}}
.panel{
  background:#fff; border:1px solid var(--line); border-radius:22px; padding:18px;
  display:flex; flex-direction:column; gap:12px;
}
.panel h3{margin:0; font-size:1.05rem}
.mode-group{display:flex; gap:6px; padding:4px; background:var(--sand); border-radius:14px}
.mode-group button{
  flex:1; padding:10px 8px; border-radius:11px; background:transparent; font-weight:700; font-size:.9rem; color:var(--ink);
}
.mode-group button.active{background:var(--teal); color:#fff}
.tool-row{display:flex; flex-wrap:wrap; gap:6px}
.tool-row button{padding:8px 12px; border-radius:10px; background:var(--sand); border:1px solid var(--line); font-weight:700}
.tool-row b{min-width:2.5em; text-align:center; align-self:center; font-family:var(--latin)}
.upload-box{
  border:1.5px dashed var(--line); border-radius:16px; padding:14px; text-align:center; background:var(--sand);
}
.upload-box input{display:none}
.upload-box label{cursor:pointer; font-weight:800; color:var(--teal); display:inline-block}
.upload-box p{margin:8px 0 0; font-size:.82rem; color:var(--mute)}
.preview-frame{
  width:100%; aspect-ratio:1; border-radius:14px; overflow:hidden; background:#e8f0f3;
  border:1px solid var(--line); display:grid; place-items:center; position:relative;
}
.preview-frame img{width:100%; height:100%; object-fit:cover; display:none}
.preview-frame.empty::after{content:attr(data-empty); color:var(--mute); font-size:.85rem; padding:12px; text-align:center}
.summary{display:grid; gap:6px; font-size:.92rem; padding-top:4px}
.summary span{color:var(--mute)}
.summary strong{font-family:var(--latin)}
.actions{display:flex; flex-wrap:wrap; gap:8px}
.btn-dark{background:var(--ink); color:#fff; padding:12px 16px; border-radius:12px; font-weight:800}
.btn-dark:disabled{opacity:.4; cursor:not-allowed}
.btn-line{background:transparent; border:1px solid var(--line); padding:12px 14px; border-radius:12px; font-weight:700}
.hint{margin:0; color:var(--mute); font-size:.84rem; min-height:1.3em}
.hint.err{color:var(--bad)}
.stage-wrap{
  background:#fff; border:1px solid var(--line); border-radius:22px; padding:12px;
  box-shadow:var(--shadow); display:flex; flex-direction:column; gap:10px; min-height:0;
}
.stage-top{display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; align-items:center}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:.82rem; color:var(--mute)}
.legend i{display:inline-block; width:12px; height:12px; border-radius:3px; margin-inline-end:6px; vertical-align:-1px; border:1px solid var(--line)}
.legend .f{background:#e8f0f3}.legend .y{background:rgba(0,168,157,.45); border-color:var(--saffron)}.legend .t{background:var(--teal); border:0}
.stage{
  position:relative; overflow:auto; border-radius:16px; background:#0b1c24;
  max-height:min(75vh,820px); overscroll-behavior:contain; touch-action:none;
  cursor:crosshair;
}
.stage.is-pan{cursor:grab}
.stage.is-pan.is-drag{cursor:grabbing}
#wallCanvas{
  display:block; width:1000px; height:1000px;
  image-rendering:pixelated; background:#dfe8ee;
  transform-origin:0 0;
}
.tip{
  position:fixed; z-index:80; pointer-events:none; display:none;
  background:rgba(7,24,32,.92); color:#fff; padding:8px 10px; border-radius:10px;
  font-size:.82rem; font-weight:700; white-space:nowrap; transform:translate(-50%,-120%);
}
.owners{margin-top:28px}
.owners h3{margin:0 0 8px}
.owners .lead{margin-top:0}
.owner-row{display:flex; gap:10px; overflow:auto; padding:8px 2px 14px; scroll-snap-type:x mandatory}
.owner-card{
  flex:0 0 auto; width:140px; scroll-snap-align:start;
  background:#fff; border:1px solid var(--line); border-radius:16px; overflow:hidden;
  transition:transform .2s, box-shadow .2s;
}
.owner-card:hover{transform:translateY(-4px); box-shadow:var(--shadow)}
.owner-card .thumb{aspect-ratio:1; background:#e8f0f3; overflow:hidden}
.owner-card img,.owner-card canvas{width:100%; height:100%; object-fit:cover; display:block}
.owner-card .meta{padding:10px; font-size:.82rem}
.owner-card .meta b{display:block; font-size:.92rem}
.owner-card .meta span{color:var(--mute)}

/* IMPACT */
.impact-bars{margin-top:32px; display:grid; gap:14px}
.ibar{display:grid; grid-template-columns:140px 1fr 64px; gap:12px; align-items:center}
@media(max-width:640px){.ibar{grid-template-columns:1fr; gap:6px}}
.ibar span{font-weight:700; font-size:.95rem}
.ibar b{font-family:var(--latin); text-align:end}
.track{height:14px; background:#e1eaef; border-radius:999px; overflow:hidden}
.fill{height:100%; width:0; border-radius:999px; transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.fill.c1{background:var(--teal)}.fill.c2{background:#14c4b7}.fill.c3{background:var(--saffron)}
.fill.c4{background:#c48a00}.fill.c5{background:var(--ink)}

/* RAMADAN */
.ramadan{
  position:relative; overflow:hidden;
  background:linear-gradient(180deg,#102832,#071820);
  color:#fff;
}
.ramadan .eyebrow{color:var(--saffron2)}
.ramadan .lead{color:rgba(255,255,255,.75)}
.ramadan-grid{
  display:grid; grid-template-columns:1.1fr 1fr; gap:28px; align-items:center; margin-top:28px;
}
@media(max-width:900px){.ramadan-grid{grid-template-columns:1fr}}
.ramadan-photo{
  border-radius:28px; overflow:hidden; aspect-ratio:16/10; position:relative;
  box-shadow:0 30px 80px rgba(0,0,0,.35);
}
.ramadan-photo img{width:100%; height:100%; object-fit:cover; display:block; animation:floaty 8s ease-in-out infinite alternate}
.ramadan-photo::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(180deg,transparent 40%, rgba(7,24,32,.55));
}
.goal-box{background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.12); border-radius:22px; padding:22px}
.goal-top{display:flex; justify-content:space-between; gap:12px; align-items:end; margin-bottom:12px}
.goal-top b{font-family:var(--latin); font-size:clamp(2rem,5vw,2.8rem); color:var(--saffron2)}
.goal-track{height:16px; background:rgba(255,255,255,.12); border-radius:999px; overflow:hidden}
.goal-fill{height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--saffron)); border-radius:999px; transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.goal-note{margin:10px 0 0; color:rgba(255,255,255,.7); font-size:.9rem}
.bags{display:grid; grid-template-columns:repeat(2,1fr); gap:12px; margin-top:18px}
@media(max-width:520px){.bags{grid-template-columns:1fr}}
.bags button{
  background:rgba(255,255,255,.96); color:var(--ink); border:1px solid transparent; border-radius:18px;
  padding:18px 16px; display:flex; flex-direction:column; align-items:flex-start; gap:4px;
  font-weight:800; transition:transform .2s, box-shadow .2s, border-color .2s;
}
.bags button .count{font-size:.82rem; color:var(--mute); font-weight:600}
.bags button .price{color:var(--saffron); font-family:var(--latin); font-size:1.15rem}
.bags button:hover{transform:translateY(-5px); box-shadow:0 18px 40px rgba(0,0,0,.25); border-color:var(--teal)}

footer{padding:40px 20px 56px; text-align:center; color:var(--mute); font-size:.9rem; background:var(--sand)}

dialog{
  border:0; border-radius:22px; padding:24px; width:min(420px,92vw); box-shadow:var(--shadow);
  animation:up .3s ease;
}
dialog::backdrop{background:rgba(7,24,32,.55); backdrop-filter:blur(4px)}
dialog h3{margin:0 0 8px; font-size:1.3rem}
label{display:block; margin-top:12px; color:var(--mute); font-size:.9rem}
input{
  width:100%; margin-top:6px; padding:12px 14px; border-radius:12px; border:1px solid var(--line);
  background:var(--sand);
}
input:focus{outline:2px solid var(--teal); border-color:transparent}
.err{color:var(--bad); min-height:1.3em; margin:8px 0 0; font-size:.88rem}
.dlg-actions{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.note{color:var(--mute); font-size:.86rem}
#wNum{font-family:var(--latin); font-weight:800; font-size:1.2rem; margin:8px 0}
textarea{width:100%; border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--sand); resize:none; font:inherit}

@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes pulse{
  0%,100%{box-shadow:0 14px 40px rgba(0,168,157,.35)}
  50%{box-shadow:0 18px 50px rgba(0,168,157,.55)}
}
@keyframes pop{from{transform:scale(.7)}to{transform:scale(1)}}
@keyframes kenburns{from{transform:scale(1.05)}to{transform:scale(1.14)}}
@keyframes floaty{from{transform:translateY(0) scale(1)}to{transform:translateY(-8px) scale(1.03)}}
@media (prefers-reduced-motion:reduce){
  .hero-photo,.ramadan-photo img,.btn-primary,.hero-canvas{animation:none!important}
  .reveal,.hero-stats div{opacity:1; transform:none; transition:none!important}
}
</style>
</head>
<body>
<header class="nav" id="nav">
  <a class="nav-brand" href="#top" data-i18n-html="brand"></a>
  <div class="nav-links">
    <a href="#how" data-i18n="navHow"></a>
    <a href="#wall" data-i18n="navWall"></a>
    <a href="#impact" data-i18n="navImpact"></a>
    <a href="#ramadan" data-i18n="navBags"></a>
    <div class="lang-wrap">
      <button class="lang-btn" id="langBtn" type="button" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="M3.5 12h17M12 3c2.7 2.5 4.1 5.5 4.1 9s-1.4 6.5-4.1 9c-2.7-2.5-4.1-5.5-4.1-9s1.4-6.5 4.1-9z" stroke="currentColor" stroke-width="1.7"/></svg>
        <span id="langLabel">العربية</span>
      </button>
      <div class="lang-menu" id="langMenu"></div>
    </div>
    <a class="nav-cta" href="#wall" data-i18n="navBook"></a>
  </div>
</header>

<section class="hero" id="top">
  <img class="hero-photo" src="assets/hero-pixels.jpg" alt="" decoding="async">
  <div class="hero-shade" aria-hidden="true"></div>
  <canvas class="hero-canvas" id="heroCanvas" aria-hidden="true"></canvas>
  <div class="hero-inner">
    <h1 class="brand" data-i18n-html="brand"></h1>
    <p class="hero-lead" data-i18n="lead"></p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="#wall" data-i18n="ctaPrimary"></a>
      <a class="btn btn-ghost" href="#impact" data-i18n="ctaSecondary"></a>
    </div>
    <p class="price-tag" data-i18n="priceTag"></p>
    <div class="hero-stats">
      <div><b data-i18n="statBlocks"></b><span data-i18n="statBlocksLabel"></span></div>
      <div><b data-i18n="statCharity"></b><span data-i18n="statCharityLabel"></span></div>
      <div><b data-i18n="statBags"></b><span data-i18n="statBagsLabel"></span></div>
    </div>
  </div>
</section>

<section id="how" class="reveal">
  <div class="wrap">
    <p class="eyebrow" data-i18n="navHow"></p>
    <h2 data-i18n="howTitle"></h2>
    <p class="lead" data-i18n="howLead"></p>
    <div class="how-layout">
      <div class="how-visual">
        <img src="assets/wall-art.jpg" alt="" decoding="async" loading="lazy">
      </div>
      <div class="how-grid">
        <article class="how-item"><div class="how-num">01</div><div><h3 data-i18n="how1Title"></h3><p data-i18n="how1Text"></p></div></article>
        <article class="how-item"><div class="how-num">02</div><div><h3 data-i18n="how2Title"></h3><p data-i18n="how2Text"></p></div></article>
        <article class="how-item"><div class="how-num">03</div><div><h3 data-i18n="how3Title"></h3><p data-i18n="how3Text"></p></div></article>
      </div>
    </div>
  </div>
</section>

<section id="wall" class="wall-section reveal">
  <div class="wrap">
    <div class="wall-head">
      <div>
        <p class="eyebrow" data-i18n="navWall"></p>
        <h2 data-i18n="wallTitle"></h2>
        <p class="lead" data-i18n="wallLead"></p>
      </div>
      <p class="wall-meta" data-i18n="wallMeta"></p>
    </div>

    <div class="wall-shell">
      <aside class="panel">
        <div class="mode-group" role="group">
          <button type="button" id="modeSelect" class="active" data-i18n="modeSelect"></button>
          <button type="button" id="modePan" data-i18n="modePan"></button>
        </div>
        <div class="tool-row">
          <button type="button" id="zout" data-i18n="zoomOut">−</button>
          <b id="zl">1×</b>
          <button type="button" id="zin" data-i18n="zoomIn">+</button>
          <button type="button" id="zreset" data-i18n="resetView"></button>
        </div>

        <div>
          <h3 data-i18n="previewTitle"></h3>
          <div class="preview-frame empty" id="previewFrame" data-empty="…">
            <img id="previewImg" alt="">
          </div>
        </div>

        <div class="upload-box">
          <label for="brandFile" data-i18n="upload"></label>
          <input id="brandFile" type="file" accept="image/png,image/jpeg,image/webp">
          <p data-i18n="uploadHint"></p>
        </div>

        <div class="summary">
          <div><span data-i18n="selected"></span>: <strong id="sumArea">—</strong></div>
          <div><span data-i18n="spot"></span>: <strong id="sumSpot">—</strong></div>
          <div><span data-i18n="price"></span>: <strong id="sumPrice">—</strong></div>
        </div>
        <div class="actions">
          <button class="btn-dark" id="book" type="button" disabled data-i18n="book"></button>
          <button class="btn-line" id="clear" type="button" data-i18n="clear"></button>
        </div>
        <p class="hint" id="hint"></p>
      </aside>

      <div class="stage-wrap">
        <div class="stage-top">
          <div class="legend">
            <span><i class="f"></i><span data-i18n="legendFree"></span></span>
            <span><i class="y"></i><span data-i18n="legendYours"></span></span>
            <span><i class="t"></i><span data-i18n="legendTaken"></span></span>
          </div>
        </div>
        <div class="stage" id="stage">
          <canvas id="wallCanvas" width="1000" height="1000"></canvas>
          <div class="tip" id="tip"></div>
        </div>
      </div>
    </div>

    <div class="owners">
      <h3 data-i18n="ownersTitle"></h3>
      <p class="lead" data-i18n="ownersLead"></p>
      <div class="owner-row" id="ownerRow"></div>
    </div>
  </div>
</section>

<section id="impact" class="reveal">
  <div class="wrap">
    <p class="eyebrow" data-i18n="navImpact"></p>
    <h2 data-i18n="impactTitle"></h2>
    <p class="lead" data-i18n="impactLead"></p>
    <div class="impact-bars" id="impactBars">
      <div class="ibar"><span data-i18n="impact1"></span><div class="track"><div class="fill c1" data-w="12.5"></div></div><b>12.5%</b></div>
      <div class="ibar"><span data-i18n="impact2"></span><div class="track"><div class="fill c2" data-w="12.5"></div></div><b>12.5%</b></div>
      <div class="ibar"><span data-i18n="impact3"></span><div class="track"><div class="fill c3" data-w="17.5"></div></div><b>17.5%</b></div>
      <div class="ibar"><span data-i18n="impact4"></span><div class="track"><div class="fill c4" data-w="7.5"></div></div><b>7.5%</b></div>
      <div class="ibar"><span data-i18n="impact5"></span><div class="track"><div class="fill c5" data-w="50"></div></div><b>50%</b></div>
    </div>
  </div>
</section>

<section id="ramadan" class="ramadan reveal">
  <div class="wrap">
    <p class="eyebrow" data-i18n="navBags"></p>
    <h2 data-i18n="bagsTitle"></h2>
    <p class="lead" data-i18n="bagsLead"></p>
    <div class="ramadan-grid">
      <div class="ramadan-photo">
        <img src="assets/ramadan-bags.jpg" alt="" decoding="async" loading="lazy">
      </div>
      <div class="goal-box">
        <div class="goal-top">
          <div>
            <div class="eyebrow" style="margin:0" data-i18n="bagsGoalLabel"></div>
            <b id="bagsCount">128</b>
          </div>
          <span>/ 1,000</span>
        </div>
        <div class="goal-track"><div class="goal-fill" id="bagsFill"></div></div>
        <p class="goal-note" id="bagsProgress"></p>
        <div class="bags" id="bagsGrid"></div>
      </div>
    </div>
  </div>
</section>

<footer data-i18n="footer"></footer>

<dialog id="dlg">
  <h3 data-i18n="bookTitle"></h3>
  <p class="note" id="dSum"></p>
  <label><span data-i18n="brandLabel"></span><input id="fName" maxlength="40"></label>
  <label><span data-i18n="igLabel"></span><input id="fIg" dir="ltr" placeholder="@brand" maxlength="31" autocapitalize="none" autocomplete="off"></label>
  <p class="note" data-i18n="bookNote"></p>
  <p class="err" id="fErr"></p>
  <div class="dlg-actions">
    <button class="btn-line" id="dCancel" type="button" data-i18n="cancel"></button>
    <button class="btn-dark" id="dGo" type="button" data-i18n="continueWa"></button>
  </div>
</dialog>

<dialog id="dlg2">
  <h3 data-i18n="waTitle"></h3>
  <p class="note" data-i18n="waHint"></p>
  <p dir="ltr" id="wNum"></p>
  <textarea id="wMsg" rows="7" readonly></textarea>
  <p class="note" id="wOk"></p>
  <div class="dlg-actions">
    <button class="btn-line" id="wClose" type="button" data-i18n="close"></button>
    <button class="btn-dark" id="wCopy" type="button" data-i18n="copy"></button>
    <a class="btn-dark" id="wLink" target="_blank" rel="noopener" data-i18n="openWa" style="display:inline-flex;align-items:center"></a>
  </div>
</dialog>

<script src="i18n.js?v=6"></script>
<script>
(function(){
  var WA='201111137409', PRICE=300, CELL=10, GRID=100, PIX=1000;
  var data=window.PIXEL_I18N, lang='ar';
  var mode='select', zoom=1, sel=null, brandImg=null, brandURL=null;
  var selecting=false, panning=false, start=null, pan0=null;
  var stage=document.getElementById('stage');
  var cv=document.getElementById('wallCanvas'), ctx=cv.getContext('2d');
  var tip=document.getElementById('tip');
  var owners=[]; // {x,y,w,h,name,ig,img,color}

  function t(k){var d=data.dict[lang]||data.dict.en; return (d&&d[k])||data.dict.en[k]||k;}
  function fmt(n){return Math.round(n).toLocaleString(lang==='ar'?'ar-EG':lang);}
  function fill(s,m){return s.replace(/\{(\w+)\}/g,function(_,k){return m[k]!=null?m[k]:'';});}

  function makeLogo(text, c1, c2){
    var c=document.createElement('canvas'); c.width=160; c.height=160;
    var g=c.getContext('2d');
    var grd=g.createLinearGradient(0,0,160,160); grd.addColorStop(0,c1); grd.addColorStop(1,c2);
    g.fillStyle=grd; g.fillRect(0,0,160,160);
    for(var i=0;i<40;i++){ g.fillStyle='rgba(255,255,255,'+(0.04+Math.random()*0.08)+')'; g.fillRect((i*17)%160,(i*29)%160,10,10); }
    g.fillStyle='#fff'; g.font='800 34px Cairo,sans-serif'; g.textAlign='center'; g.textBaseline='middle';
    g.fillText(text, 80, 80);
    var im=new Image(); im.src=c.toDataURL('image/png'); return im;
  }

  // Demo donors already visible on the wall
  function seedOwners(){
    var demos=[
      {x:5,y:5,w:8,h:8,name:'Nile Craft',ig:'nilecraft',c1:'#00a89d',c2:'#065f5a'},
      {x:40,y:12,w:12,h:6,name:'Cairo Beans',ig:'cairbeans',c1:'#e3a008',c2:'#8a5a00'},
      {x:70,y:40,w:10,h:10,name:'HandMade EG',ig:'handmade.eg',c1:'#1f6feb',c2:'#0b3d91'},
      {x:20,y:55,w:6,h:6,name:'Yasmine',ig:'yasmine.art',c1:'#d4537e',c2:'#7a1f3d'},
      {x:55,y:70,w:14,h:8,name:'Souq Soft',ig:'souqsoft',c1:'#12b886',c2:'#087f5b'},
      {x:8,y:80,w:9,h:9,name:'Pixel Tea',ig:'pixeltea',c1:'#f08c00',c2:'#ad6800'}
    ];
    owners=demos.map(function(d){
      return {x:d.x,y:d.y,w:d.w,h:d.h,name:d.name,ig:d.ig,color:d.c1,img:makeLogo(d.name.split(' ')[0].slice(0,6), d.c1, d.c2)};
    });
  }

  function applyI18n(){
    document.querySelectorAll('[data-i18n]').forEach(function(el){el.textContent=t(el.getAttribute('data-i18n'));});
    document.querySelectorAll('[data-i18n-html]').forEach(function(el){el.innerHTML=t(el.getAttribute('data-i18n-html'));});
    document.title=t('title');
    var cur=data.langs.find(function(L){return L.code===lang;});
    document.getElementById('langLabel').textContent=cur?cur.name:t('lang');
    document.getElementById('previewFrame').setAttribute('data-empty', t('previewTitle'));
    document.getElementById('hint').textContent=t('hintTap');
    document.getElementById('hint').className='hint';
    renderBags(); renderOwners(); updateSummary();
  }

  // language menu
  var langBtn=document.getElementById('langBtn'), langMenu=document.getElementById('langMenu');
  data.langs.forEach(function(L){
    var b=document.createElement('button'); b.type='button'; b.textContent=L.name; b.dataset.code=L.code;
    b.addEventListener('click',function(){setLang(L.code);}); langMenu.appendChild(b);
  });
  function markLang(){langMenu.querySelectorAll('button').forEach(function(b){b.classList.toggle('active',b.dataset.code===lang);});}
  function setLang(code){
    if(!data.dict[code]) return;
    lang=code; localStorage.setItem('pixel-lang',code);
    document.documentElement.lang=code;
    document.documentElement.dir=data.rtl.indexOf(code)>=0?'rtl':'ltr';
    applyI18n(); markLang(); langMenu.classList.remove('open');
  }
  langBtn.addEventListener('click',function(e){e.stopPropagation(); langMenu.classList.toggle('open');});
  document.addEventListener('click',function(e){if(!e.target.closest('.lang-wrap')) langMenu.classList.remove('open');});
  window.addEventListener('scroll',function(){document.getElementById('nav').classList.toggle('scrolled', window.scrollY>20);},{passive:true});

  // hero particles
  (function(){
    var c=document.getElementById('heroCanvas'); if(!c) return;
    var ctx=c.getContext('2d'), dots=[], w, h, dpr;
    function resize(){
      dpr=Math.min(devicePixelRatio||1,2); w=c.clientWidth; h=c.clientHeight;
      c.width=w*dpr; c.height=h*dpr; ctx.setTransform(dpr,0,0,dpr,0,0); dots=[];
      for(var i=0;i<60;i++) dots.push({x:Math.random()*w,y:Math.random()*h,s:6+Math.random()*14,vx:(Math.random()-.5)*.3,vy:-.2-Math.random()*.35,c:Math.random()>.5?'rgba(0,168,157,.5)':'rgba(227,160,8,.4)',a:Math.random()});
    }
    function tick(){
      ctx.clearRect(0,0,w,h);
      dots.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.a+=.01; if(p.y<-20){p.y=h+10;p.x=Math.random()*w;} ctx.globalAlpha=.3+Math.sin(p.a)*.25; ctx.fillStyle=p.c; ctx.fillRect(p.x,p.y,p.s,p.s);});
      ctx.globalAlpha=1; requestAnimationFrame(tick);
    }
    resize(); tick(); window.addEventListener('resize',resize);
  })();

  var io=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      if(!en.isIntersecting) return;
      en.target.classList.add('in');
      if(en.target.id==='impact') en.target.querySelectorAll('.fill').forEach(function(f){f.style.width=f.dataset.w+'%';});
      if(en.target.id==='ramadan') document.getElementById('bagsFill').style.width='12.8%';
    });
  },{threshold:.18});
  document.querySelectorAll('.reveal').forEach(function(el){io.observe(el);});

  function overlaps(a,b){
    return !(a.x+a.w<=b.x || b.x+b.w<=a.x || a.y+a.h<=b.y || b.y+b.h<=a.y);
  }
  function hitsOwner(rect){
    for(var i=0;i<owners.length;i++) if(overlaps(rect, owners[i])) return owners[i];
    return null;
  }
  function ownerAtCell(cx,cy){
    for(var i=0;i<owners.length;i++){
      var o=owners[i];
      if(cx>=o.x && cx<o.x+o.w && cy>=o.y && cy<o.y+o.h) return o;
    }
    return null;
  }

  function draw(){
    ctx.clearRect(0,0,PIX,PIX);
    ctx.fillStyle='#e7eef3'; ctx.fillRect(0,0,PIX,PIX);
    // grid
    ctx.strokeStyle='rgba(7,24,32,.08)'; ctx.lineWidth=1; ctx.beginPath();
    var step = zoom>=3 ? CELL : (zoom>=1.5 ? CELL*2 : CELL*5);
    for(var i=0;i<=PIX;i+=step){ ctx.moveTo(i+.5,0); ctx.lineTo(i+.5,PIX); ctx.moveTo(0,i+.5); ctx.lineTo(PIX,i+.5); }
    ctx.stroke();
    // owners with images
    owners.forEach(function(o){
      var x=o.x*CELL, y=o.y*CELL, w=o.w*CELL, h=o.h*CELL;
      if(o.img && o.img.complete){ ctx.drawImage(o.img, x, y, w, h); }
      else { ctx.fillStyle=o.color||'#00a89d'; ctx.fillRect(x,y,w,h); }
      ctx.strokeStyle='rgba(255,255,255,.65)'; ctx.lineWidth=2; ctx.strokeRect(x+.5,y+.5,w-1,h-1);
    });
    // selection
    if(sel){
      var x=sel.x*CELL, y=sel.y*CELL, w=sel.w*CELL, h=sel.h*CELL;
      if(brandImg && brandImg.complete){
        ctx.save(); ctx.globalAlpha=.85; ctx.drawImage(brandImg, x, y, w, h); ctx.restore();
      } else {
        ctx.fillStyle='rgba(0,168,157,.35)'; ctx.fillRect(x,y,w,h);
      }
      ctx.strokeStyle='#e3a008'; ctx.lineWidth=3; ctx.strokeRect(x+1.5,y+1.5,w-3,h-3);
    }
  }

  function setZoom(z){
    var prev=zoom; zoom=Math.max(1, Math.min(8, z));
    cv.style.width=(PIX*zoom)+'px'; cv.style.height=(PIX*zoom)+'px';
    document.getElementById('zl').textContent=zoom+'×';
    // keep center
    var cx=stage.scrollLeft+stage.clientWidth/2, cy=stage.scrollTop+stage.clientHeight/2;
    var scale=zoom/prev;
    requestAnimationFrame(function(){
      stage.scrollLeft=cx*scale - stage.clientWidth/2;
      stage.scrollTop=cy*scale - stage.clientHeight/2;
      draw();
    });
  }

  function cellFromEvent(e){
    var r=cv.getBoundingClientRect();
    var x=Math.max(0, Math.min(GRID-1, Math.floor((e.clientX-r.left)/r.width*GRID)));
    var y=Math.max(0, Math.min(GRID-1, Math.floor((e.clientY-r.top)/r.height*GRID)));
    return {x:x,y:y};
  }
  function rectOf(a,b){
    return {x:Math.min(a.x,b.x), y:Math.min(a.y,b.y), w:Math.abs(a.x-b.x)+1, h:Math.abs(a.y-b.y)+1};
  }

  function syncMode(){
    var pan=mode==='pan';
    document.getElementById('modeSelect').classList.toggle('active', !pan);
    document.getElementById('modePan').classList.toggle('active', pan);
    stage.classList.toggle('is-pan', pan);
  }
  document.getElementById('modeSelect').onclick=function(){mode='select'; syncMode();};
  document.getElementById('modePan').onclick=function(){mode='pan'; syncMode();};
  document.getElementById('zin').onclick=function(){setZoom(zoom+1); if(zoom>1){mode='pan'; syncMode();}};
  document.getElementById('zout').onclick=function(){setZoom(zoom-1); if(zoom===1){mode='select'; syncMode();}};
  document.getElementById('zreset').onclick=function(){setZoom(1); mode='select'; syncMode(); stage.scrollLeft=0; stage.scrollTop=0;};

  stage.addEventListener('pointerdown', function(e){
    if(e.button) return;
    stage.setPointerCapture(e.pointerId);
    if(mode==='pan'){
      panning=true; stage.classList.add('is-drag');
      pan0={x:e.clientX,y:e.clientY,sl:stage.scrollLeft,st:stage.scrollTop};
      return;
    }
    selecting=true; start=cellFromEvent(e); sel=rectOf(start,start); updateSummary(); draw();
  });
  stage.addEventListener('pointermove', function(e){
    if(panning && pan0){
      stage.scrollLeft=pan0.sl-(e.clientX-pan0.x);
      stage.scrollTop=pan0.st-(e.clientY-pan0.y);
      return;
    }
    if(selecting && start){ sel=rectOf(start, cellFromEvent(e)); updateSummary(); draw(); return; }
    // hover tip for donors
    var c=cellFromEvent(e), o=ownerAtCell(c.x,c.y);
    if(o){
      var r=stage.getBoundingClientRect();
      tip.style.display='block';
      tip.style.left=e.clientX+'px';
      tip.style.top=e.clientY+'px';
      tip.textContent=t('donor')+': '+o.name+' · @'+o.ig;
    } else tip.style.display='none';
  });
  function endPtr(){ selecting=false; panning=false; pan0=null; stage.classList.remove('is-drag'); }
  stage.addEventListener('pointerup', endPtr);
  stage.addEventListener('pointercancel', endPtr);

  function updateSummary(){
    var hint=document.getElementById('hint');
    if(!sel){
      document.getElementById('sumArea').textContent='—';
      document.getElementById('sumSpot').textContent='—';
      document.getElementById('sumPrice').textContent='—';
      document.getElementById('book').disabled=true;
      return;
    }
    var pxW=sel.w*CELL, pxH=sel.h*CELL, price=sel.w*sel.h*PRICE;
    document.getElementById('sumArea').textContent=pxW+'×'+pxH+' px';
    document.getElementById('sumSpot').textContent='('+(sel.x*CELL)+', '+(sel.y*CELL)+')';
    document.getElementById('sumPrice').textContent=fmt(price)+' '+t('currency');
    var hit=hitsOwner(sel);
    if(hit){
      hint.textContent=t('hintTaken'); hint.className='hint err';
      document.getElementById('book').disabled=true;
    } else if(!brandImg){
      hint.textContent=t('hintNeedImage'); hint.className='hint';
      document.getElementById('book').disabled=true;
    } else {
      hint.textContent=t('hintTap'); hint.className='hint';
      document.getElementById('book').disabled=false;
    }
  }

  document.getElementById('clear').onclick=function(){
    sel=null; brandImg=null; brandURL=null;
    var img=document.getElementById('previewImg'); img.style.display='none'; img.src='';
    document.getElementById('previewFrame').classList.add('empty');
    document.getElementById('brandFile').value='';
    updateSummary(); draw();
  };

  document.getElementById('brandFile').addEventListener('change', function(e){
    var f=e.target.files && e.target.files[0]; if(!f) return;
    var url=URL.createObjectURL(f);
    var im=new Image();
    im.onload=function(){
      brandImg=im; brandURL=url;
      var p=document.getElementById('previewImg'); p.src=url; p.style.display='block';
      document.getElementById('previewFrame').classList.remove('empty');
      updateSummary(); draw();
    };
    im.src=url;
  });

  function renderOwners(){
    var row=document.getElementById('ownerRow'); row.innerHTML='';
    owners.forEach(function(o){
      var card=document.createElement('button'); card.type='button'; card.className='owner-card';
      var thumb=document.createElement('div'); thumb.className='thumb';
      if(o.img){ var i=document.createElement('img'); i.src=o.img.src; i.alt=o.name; thumb.appendChild(i); }
      var meta=document.createElement('div'); meta.className='meta';
      meta.innerHTML='<b>'+o.name+'</b><span>@'+o.ig+'</span><span>'+(o.w*CELL)+'×'+(o.h*CELL)+' px</span>';
      card.appendChild(thumb); card.appendChild(meta);
      card.addEventListener('click', function(){
        // center view on donor
        mode='pan'; syncMode();
        setZoom(Math.max(zoom,2));
        requestAnimationFrame(function(){
          stage.scrollLeft = o.x*CELL*zoom - stage.clientWidth/2 + (o.w*CELL*zoom)/2;
          stage.scrollTop = o.y*CELL*zoom - stage.clientHeight/2 + (o.h*CELL*zoom)/2;
        });
      });
      row.appendChild(card);
    });
  }

  // dialogs / booking
  document.getElementById('wNum').textContent='+'+WA.replace(/(\d{2})(\d{3})(\d{3})(\d{4})/,'$1 $2 $3 $4');
  function openWA(text){
    document.getElementById('wMsg').value=text; document.getElementById('wOk').textContent='';
    document.getElementById('wLink').href='https://wa.me/'+WA+'?text='+encodeURIComponent(text);
    document.getElementById('dlg2').showModal();
  }
  document.getElementById('wClose').onclick=function(){document.getElementById('dlg2').close();};
  document.getElementById('wCopy').onclick=function(){
    var m=document.getElementById('wMsg'); m.select();
    navigator.clipboard.writeText(m.value).then(function(){document.getElementById('wOk').textContent=t('copied');}).catch(function(){document.getElementById('wOk').textContent=t('copyFail');});
  };
  document.getElementById('book').onclick=function(){
    if(!sel){document.getElementById('hint').textContent=t('errSpot'); document.getElementById('hint').className='hint err'; return;}
    if(!brandImg){document.getElementById('hint').textContent=t('errImage'); document.getElementById('hint').className='hint err'; return;}
    if(hitsOwner(sel)){document.getElementById('hint').textContent=t('hintTaken'); document.getElementById('hint').className='hint err'; return;}
    document.getElementById('fName').value=''; document.getElementById('fIg').value=''; document.getElementById('fErr').textContent='';
    document.getElementById('dSum').textContent=fill(t('dSum'),{w:sel.w*CELL,h:sel.h*CELL,x:sel.x*CELL,y:sel.y*CELL,price:fmt(sel.w*sel.h*PRICE),currency:t('currency')});
    document.getElementById('dlg').showModal();
  };
  document.getElementById('dCancel').onclick=function(){document.getElementById('dlg').close();};
  document.getElementById('dGo').onclick=function(){
    var name=document.getElementById('fName').value.trim();
    var ig=document.getElementById('fIg').value.trim().replace(/^@/,'');
    if(!name){document.getElementById('fErr').textContent=t('errName'); return;}
    if(!/^[A-Za-z0-9._]{1,30}$/.test(ig)){document.getElementById('fErr').textContent=t('errIg'); return;}
    // show immediately on wall (prototype)
    owners.push({x:sel.x,y:sel.y,w:sel.w,h:sel.h,name:name,ig:ig,color:'#00a89d',img:brandImg});
    renderOwners(); draw();
    openWA(fill(t('waBook'),{name:name,ig:ig,w:sel.w*CELL,h:sel.h*CELL,x:sel.x*CELL,y:sel.y*CELL,price:fmt(sel.w*sel.h*PRICE),currency:t('currency')}));
    document.getElementById('dlg').close();
    sel=null; updateSummary(); draw();
  };

  var BAGS_FUNDED=128, PRICE_BAG=300;
  function renderBags(){
    var el=document.getElementById('bagsGrid'); if(!el) return;
    el.innerHTML='';
    document.getElementById('bagsCount').textContent=fmt(BAGS_FUNDED);
    document.getElementById('bagsProgress').textContent=fill(t('bagsProgress'),{n:fmt(BAGS_FUNDED)});
    [[1,'bag1'],[5,'bag5'],[20,'bag20'],[100,'bag100']].forEach(function(p){
      var count=p[0], total=count*PRICE_BAG;
      var b=document.createElement('button'); b.type='button';
      b.innerHTML='<span>'+t(p[1])+'</span><span class="count">× '+fmt(count)+'</span><span class="price">'+fmt(total)+' '+t('currency')+'</span>';
      b.addEventListener('click',function(){openWA(fill(t('waBag'),{n:fmt(count),price:fmt(total),currency:t('currency')}));});
      el.appendChild(b);
    });
  }

  // boot
  seedOwners();
  // redraw when demo images load
  owners.forEach(function(o){ if(o.img) o.img.onload=function(){draw(); renderOwners();}; });
  var saved=localStorage.getItem('pixel-lang');
  if(saved&&data.dict[saved]) lang=saved;
  else {var n=(navigator.language||'ar').slice(0,2).toLowerCase(); if(data.dict[n]) lang=n;}
  document.documentElement.lang=lang;
  document.documentElement.dir=data.rtl.indexOf(lang)>=0?'rtl':'ltr';
  applyI18n(); markLang(); syncMode(); setZoom(1); draw();
})();
</script>
